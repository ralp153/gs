<!DOCTYPE html>
<html>
<head>
    <title>My Godot Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            text-align: center;
        }

        header {
            background: #080808;
            padding: 30px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 45px;
            margin: 0;
            letter-spacing: 2px;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h2 {
            color: #fff;
        }

        p {
            color: #ccc;
        }

        .download {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        .download:hover {
            background: #000;
            color: #fff;
        }

        .version {
            color: #777;
            margin-top: 15px;
        }

        footer {
            margin-top: 80px;
            padding: 20px;
            background: #080808;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY GODOT GAME</h1>
        <p>Made by me and my friends</p>
    </header>

    <div class="container">

        <h2>About the game</h2>

        <p>
            This is our game made in Godot.
            Play with your friends and see how far you can get.
        </p>

        <h2>Latest version</h2>

        <p class="version">Version 1.0.0</p>

        <button class="download" onclick="window.location.href='https://savedly.net/f/axvhwpmj'">
            DOWNLOAD
        </button>

    </div>

    <footer>
        <p>© 2026 My Game</p>
    </footer>

</body>
</html>
